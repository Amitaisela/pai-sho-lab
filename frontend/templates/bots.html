{% extends "base.html" %}
{% block title %}Bots — Pai Sho Lab{% endblock %}
{% block content %}
<div class="bots">
  <h1>Play MushiBot</h1>
  <p class="muted">Six levels, each one built a different way under the hood. Start anywhere — you can switch levels before every game.</p>
  <div class="time-control">
    <span class="muted time-control__label">Time control</span>
    <div id="bots-time-control"></div>
  </div>
  <div class="bots-grid" id="bots-grid"></div>
</div>
{% endblock %}
{% block scripts %}
  <script type="module" src="/static/js/bots.js"></script>
{% endblock %}
