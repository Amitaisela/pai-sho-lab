<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f1efe8" media="(prefers-color-scheme: light)">
  <title>{% block title %}Pai Sho Lab{% endblock %}</title>
  <script src="/static/js/theme-init.js"></script>
  <link rel="icon" href="/static/tiles/GL.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/static/css/pai.css">
  {% block head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
  <header class="topbar">
    <a class="topbar__brand" href="/">
      <img class="topbar__logo" src="/static/tiles/GL.png" alt="" width="28" height="28">
      <span class="topbar__name">Pai Sho Lab</span>
    </a>
    <nav class="topbar__nav" aria-label="Main">
      <a href="/">Play</a>
      <a href="/learn">Learn</a>
      <a href="/bots">Bots</a>
      <a href="/developers">Developers</a>
    </nav>
    <div class="topbar__right">
      <button type="button" class="chip" data-nickname-chip aria-label="Your nickname">Guest</button>
      <button type="button" class="menu-btn" data-menu-btn aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <a id="lab-link" href="/lab" hidden>Lab</a>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script type="module" src="/static/js/chrome-init.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
