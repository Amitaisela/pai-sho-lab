services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: mushibot
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
    cap_add: [NET_ADMIN, NET_RAW]
    ports:
      - "5000:5000"
    restart: unless-stopped

  backend:
    build: .
    network_mode: service:tailscale
    depends_on: [tailscale, postgres]
    environment:
      - MUSHIBOT_API_TOKEN=${MUSHIBOT_API_TOKEN:-}
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mushibot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mushibot}
      - POSTGRES_DB=mushibot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  tailscale-state:
  postgres-data:
