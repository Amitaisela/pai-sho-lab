[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "RustEngine"
version = "0.1.0"
requires-python = ">=3.11"
description = "PyO3 bridge exposing the Rust Skud Pai Sho rules engine as a drop-in PaiShoGame replacement"

[tool.maturin]
module-name = "RustEngine"
features = ["pyo3/extension-module"]
